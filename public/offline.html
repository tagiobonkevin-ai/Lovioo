<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF2D9A">
<title>You're offline · Lovioo</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:Poppins,ui-sans-serif,system-ui,sans-serif;color:#0F2742;
    background:linear-gradient(135deg,#FFE3F1 0%,#FFE9E2 50%,#FFF3DE 100%)}
  .card{max-width:340px;background:#fff;border-radius:28px;padding:32px;text-align:center;box-shadow:0 10px 30px -12px rgba(15,39,66,.18)}
  img{width:64px;height:64px;border-radius:18px}
  .emoji{font-size:56px;margin:16px 0 4px;animation:f 4s ease-in-out infinite}
  @keyframes f{50%{transform:translateY(-8px)}}
  h1{font-size:20px;margin:8px 0 4px}
  p{font-size:14px;line-height:1.5;color:rgba(15,39,66,.7);margin:0}
  button{margin-top:20px;border:0;border-radius:999px;padding:12px 22px;font:600 14px inherit;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,#FF2D9A 0%,#FF6B4A 55%,#FFB84D 100%);box-shadow:0 18px 40px -14px rgba(255,45,154,.45)}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Lovioo">
    <div class="emoji">📡</div>
    <h1>You're offline</h1>
    <p>Lovioo needs a connection to show live prices. Your saved items are safe — try again when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
